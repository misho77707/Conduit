server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through this proxy too (see MAX_UPLOAD_MB in backend/app/api/files.py).
    client_max_body_size 2048m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-Sent Events (/api/jobs/{id}/events) need streaming, not buffering.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # HashRouter: the app only ever requests "/", so this is here for direct deep-links / refreshes.
    location / {
        try_files $uri /index.html;
    }
}
