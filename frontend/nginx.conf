# The default "combined" log format, but with the path only (no query string): used for the job event stream below.
log_format noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go through this proxy too (see MAX_UPLOAD_MB in backend/app/api/files.py).
    client_max_body_size 2048m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The address nginx itself saw, never one a client sent. The API trusts this header only when the request
        # comes from this container (uvicorn --forwarded-allow-ips, docker-compose.yml): login throttling counts
        # failures per username and real client address.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Server-Sent Events (/api/jobs/{id}/events) need streaming, not buffering.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # A job's live event stream. EventSource can't send headers, so its login token is in the URL (?token=...):
    # the access log gets the path without the query string, and the error log only critical lines (an upstream
    # error line would quote the full URL), so tokens never reach the logs.
    location ~ ^/api/jobs/[^/]+/events$ {
        access_log /var/log/nginx/access.log noargs;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # HashRouter: the app only ever requests "/", so this is here for direct deep-links / refreshes.
    location / {
        try_files $uri /index.html;
    }
}
