[project]
name = "conduit-backend"
version = "0.1.0"
description = "Conduit: data operations console (API + worker)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "pyjwt>=2.9",
  "cryptography>=43",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "clickhouse-connect>=0.8",
  "pymysql>=1.1",
  "pymongo>=4.8",
  "duckdb>=1.1,<2",  # 2.0 removed APIs the engine uses (fetch_arrow_table, relation.fetchone): moving is its own task
  "openpyxl>=3.1",
  "pyarrow>=15",
  "pandas>=2.2",
  "pytz>=2024.1",  # DuckDB needs it to hand TIMESTAMPTZ values to Python; pandas 3 no longer pulls it in
  "croniter>=2.0",
  "python-multipart>=0.0.9",
  "psutil>=5.9",
  "boto3>=1.34",  # S3 storage connections
  "paramiko>=3.4",  # SFTP storage connections
  "httpx>=0.27",  # HTTP(S) storage connections and ad-hoc URLs
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "mongomock>=4.1", "moto[s3]>=5.0", "aiosmtpd>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
