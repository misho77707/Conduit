# Conduit: frontend + api + worker + beat + redis + postgres.
#
#   mkdir -p data          # before the first start, so ./data belongs to you and not to root
#   cp .env.example .env   # then set CONDUIT_SECRET_KEY (see the file)
#   docker compose up --build

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  # Run as the owner of ./data (uid 1000 is the default user in WSL / most Linux hosts). If `ls -n data` shows a
  # different owner, set CONDUIT_UID / CONDUIT_GID in .env, otherwise uploads and reject files cannot be written.
  user: "${CONDUIT_UID:-1000}:${CONDUIT_GID:-1000}"
  environment: &backend-env
    HOME: /tmp
    CONDUIT_DATABASE_URL: postgresql+psycopg://conduit:${POSTGRES_PASSWORD:-conduit}@postgres:5432/conduit
    CONDUIT_REDIS_URL: redis://redis:6379/0
    CONDUIT_SECRET_KEY: ${CONDUIT_SECRET_KEY:?Set CONDUIT_SECRET_KEY in .env (see .env.example)}
    CONDUIT_ADMIN_USER: ${CONDUIT_ADMIN_USER:-admin}
    CONDUIT_ADMIN_PASSWORD: ${CONDUIT_ADMIN_PASSWORD:-}
    CONDUIT_DATA_DIR: /data
    CONDUIT_CORS_ORIGINS: ${CONDUIT_CORS_ORIGINS:-http://localhost:5173}
    CONDUIT_HEALTH_CHECK_INTERVAL_S: ${CONDUIT_HEALTH_CHECK_INTERVAL_S:-30}
    CONDUIT_JWT_TTL_MINUTES: ${CONDUIT_JWT_TTL_MINUTES:-}
    CONDUIT_MONITOR_DISKS: ${CONDUIT_MONITOR_DISKS:-} # extra disks for the Monitor, e.g. "/mnt/big:Big disk"
    # The upload ceiling is what nginx accepts: the frontend container reads it too (restart both to change it).
    CONDUIT_UPLOAD_CEILING_MB: ${CONDUIT_UPLOAD_CEILING_MB:-2048}
    # The rest below can also be changed in Control & Setup > Settings, which wins over these. Empty = the default
    # (README "Settings" lists every one with its default and bounds).
    CONDUIT_KEEP_FINISHED_JOBS: ${CONDUIT_KEEP_FINISHED_JOBS:-10}
    CONDUIT_KEEP_COMPARISONS: ${CONDUIT_KEEP_COMPARISONS:-}
    CONDUIT_MAX_WORKERS_PER_JOB: ${CONDUIT_MAX_WORKERS_PER_JOB:-}
    CONDUIT_CONNECT_TIMEOUT_S: ${CONDUIT_CONNECT_TIMEOUT_S:-}
    CONDUIT_UPLOAD_MAX_MB: ${CONDUIT_UPLOAD_MAX_MB:-}
    CONDUIT_MONITOR_WARN_PCT: ${CONDUIT_MONITOR_WARN_PCT:-}
    CONDUIT_CHECK_TIMEOUT_S: ${CONDUIT_CHECK_TIMEOUT_S:-}
    CONDUIT_CONNECTION_SLOW_MS: ${CONDUIT_CONNECTION_SLOW_MS:-}
    CONDUIT_CHECK_SLOW_MS: ${CONDUIT_CHECK_SLOW_MS:-}
    # Alerts: links in messages need the address people open Conduit at, e.g. https://conduit.example.com
    CONDUIT_PUBLIC_URL: ${CONDUIT_PUBLIC_URL:-}
    CONDUIT_INSTANCE_NAME: ${CONDUIT_INSTANCE_NAME:-}
    CONDUIT_ALERT_SEND_TIMEOUT_S: ${CONDUIT_ALERT_SEND_TIMEOUT_S:-}
    # Remote intake (S3 / SFTP / URL files): see README "Remote files"
    CONDUIT_REMOTE_MAX_FILE_MB: ${CONDUIT_REMOTE_MAX_FILE_MB:-20480}
    CONDUIT_REMOTE_MAX_FILES: ${CONDUIT_REMOTE_MAX_FILES:-500}
    CONDUIT_REMOTE_INSPECT_FULL_MB: ${CONDUIT_REMOTE_INSPECT_FULL_MB:-200}
    CONDUIT_REMOTE_CACHE_MB: ${CONDUIT_REMOTE_CACHE_MB:-2048}
    CONDUIT_REMOTE_TIMEOUT_S: ${CONDUIT_REMOTE_TIMEOUT_S:-60}
    CONDUIT_REMOTE_LIST_MAX: ${CONDUIT_REMOTE_LIST_MAX:-100000}
    # Combined pipeline sources (several inputs joined by SQL): see README "Combined sources"
    CONDUIT_COMBINED_PREVIEW_ROWS: ${CONDUIT_COMBINED_PREVIEW_ROWS:-100000}
    CONDUIT_COMBINED_LOOKUP_MAX_ROWS: ${CONDUIT_COMBINED_LOOKUP_MAX_ROWS:-5000000}
    CONDUIT_COMBINED_LOOKUP_MAX_MB: ${CONDUIT_COMBINED_LOOKUP_MAX_MB:-2048}
    CONDUIT_COMBINED_MIN_FREE_GB: ${CONDUIT_COMBINED_MIN_FREE_GB:-5}
    CONDUIT_COMBINED_MIN_FREE_PCT: ${CONDUIT_COMBINED_MIN_FREE_PCT:-5}
    # Behind a TLS-intercepting proxy, mount its root CA into api + worker (e.g. ./certs/ca.pem:/certs/ca.pem:ro)
    # and add SSL_CERT_FILE: /certs/ca.pem and AWS_CA_BUNDLE: /certs/ca.pem here (never set them empty: OpenSSL
    # would then trust nothing).
  volumes:
    - ./data:/data # uploads, rejects, SQLite/DuckDB files: drop files here
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conduit}
      POSTGRES_DB: conduit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"] # queue + live state only; nothing to persist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    # The API is reached only through the frontend's nginx (http://localhost:5173/api/...), so its port is not
    # published. uvicorn takes the client address from X-Forwarded-For only when the request comes from that nginx
    # (CONDUIT_PROXY_IP, a fixed address below): never from anyone else.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "${CONDUIT_PROXY_IP:-172.30.80.10}"]
    # Local development only (`npm run dev` proxies /api to localhost:8000; OpenAPI docs at /docs): uncomment to
    # publish the API on this machine's loopback interface.
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Optional: to use "docker" service checks in Monitor (is a container running / healthy?), mount the Docker
    # socket read-only and uncomment. Note `volumes:` here replaces the whole list inherited from &backend, so
    # keep the ./data line too. Only do this if you trust every user of this app - it grants read access to
    # every container name, image, and running command on the host.
    #
    # The container runs as uid:gid 1000:1000 (see CONDUIT_UID/CONDUIT_GID above), which cannot read the socket
    # on its own - verified live, it fails with "permission denied on /var/run/docker.sock" otherwise. On Docker
    # Desktop the socket is owned root:root, so `group_add: ["0"]` (adds root as a supplementary group) is enough;
    # on native Linux it's usually root:docker instead, so use that group's actual GID (`getent group docker`) in
    # place of "0" if root doesn't have access there.
    # volumes:
    #   - ./data:/data
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add:
    #   - "0"

  # One worker process runs one job at a time; each job uses its own threads (options.workers) inside it.
  # CONDUIT_WORKER_CONCURRENCY = how many jobs can run at once.
  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=${CONDUIT_WORKER_CONCURRENCY:-4}"]
    # Optional, see the api service above for why and for the group_add note: mount the Docker socket read-only
    # for "docker" checks run by this worker (scheduled/manual re-runs go through Celery, not just the API's own
    # immediate-run thread).
    # volumes:
    #   - ./data:/data
    #   - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add:
    #   - "0"

  # Exactly one beat, so scaling `worker` never duplicates the schedule.
  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      CONDUIT_UPLOAD_CEILING_MB: ${CONDUIT_UPLOAD_CEILING_MB:-2048} # nginx's client_max_body_size, in MB
    ports:
      - "5173:80"
    networks:
      default:
        ipv4_address: ${CONDUIT_PROXY_IP:-172.30.80.10} # the one address the API trusts X-Forwarded-For from
    depends_on:
      api:
        condition: service_healthy

# A fixed subnet so nginx can have a fixed address (above). Every other container gets one from
# CONDUIT_SUBNET_DYNAMIC, which leaves CONDUIT_PROXY_IP free. If the subnet clashes with another network on this
# host, change all three in .env (CONDUIT_PROXY_IP inside CONDUIT_SUBNET, outside CONDUIT_SUBNET_DYNAMIC).
networks:
  default:
    ipam:
      config:
        - subnet: ${CONDUIT_SUBNET:-172.30.80.0/24}
          ip_range: ${CONDUIT_SUBNET_DYNAMIC:-172.30.80.128/25}

volumes:
  pgdata:
